[project]
name = "rag-tax"
version = "0.1.0"
description = "Prototype for a tax-law grounded search engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pgvector>=0.3.6,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "openai>=1.30,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.9,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # pycodestyle, pyflakes, isort, pyupgrade
ignore = ["E501"]                # 줄 길이는 ruff format이 담당

[tool.ruff.format]
quote-style = "double"
