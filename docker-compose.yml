services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_tax
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_tax"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  db-init:
    image: python:3.11-slim
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rag_tax
    command:
      - sh
      - -lc
      - |
        python -m pip install --no-cache-dir "psycopg[binary]>=3.2,<4.0" &&
        python -m app.bootstrap init-and-seed
    restart: "no"

volumes:
  postgres_data:
